services:
  copilot:
    build: .
    ports: ["8000:8000"]
    environment:
      # Optional: let an OpenAI-compatible model propose query plans. Leave unset to use the rule-based planner.
      COPILOT_LLM_API_KEY: ${COPILOT_LLM_API_KEY:-}
      COPILOT_LLM_BASE_URL: ${COPILOT_LLM_BASE_URL:-https://api.openai.com/v1}
      COPILOT_LLM_MODEL: ${COPILOT_LLM_MODEL:-gpt-4o-mini}
