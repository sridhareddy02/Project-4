[project]
name = "mktg-copilot"
version = "1.0.0"
description = "A governed, verifiable natural-language analytics copilot for marketing performance data (synthetic)."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4", "statsmodels>=0.14",
  "pydantic>=2.6", "pyyaml>=6.0", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning", "ignore::RuntimeWarning", "ignore::DeprecationWarning"]
